[project]
name = "sql-lab"
version = "0.1.0"
description = "sql work for DS2022"
readme = "README.md"
authors = [
    { name = "Jimmy Brown", email = "131711569+jimmyb25@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "mysql-connector-python>=26.7.0",
    "pandas>=3.0.6",
    "sqlalchemy>=2.0.54",
]

[project.scripts]
sql-lab = "sql_lab:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
